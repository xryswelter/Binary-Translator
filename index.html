<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Translate text to binary and binary back to text, instantly."
    />
    <title>Binary Translator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
  </head>

  <body>
    <main class="app">
      <header class="hero">
        <p class="eyebrow" aria-hidden="true">01000010 01101001 01101110</p>
        <h1>Binary Translator</h1>
        <p class="lede">
          Type text to see its binary, or paste binary to read it back. Works
          with any character, emoji included.
        </p>
      </header>

      <section class="card">
        <div class="toolbar">
          <div
            class="segmented"
            role="group"
            aria-label="Translation direction"
          >
            <button
              class="segment active"
              type="button"
              aria-pressed="true"
              data-mode="etb"
            >
              Text → Binary
            </button>
            <button
              class="segment"
              type="button"
              aria-pressed="false"
              data-mode="bte"
            >
              Binary → Text
            </button>
            <span class="segment-indicator" aria-hidden="true"></span>
          </div>
        </div>

        <div class="panes">
          <div class="pane">
            <div class="pane-head">
              <label for="original" id="inputLabel">Text</label>
              <button class="ghost" id="clearButton" type="button">
                Clear
              </button>
            </div>
            <textarea
              id="original"
              spellcheck="false"
              placeholder="Hello, world!"
              aria-describedby="hint"
            ></textarea>
            <p class="hint" id="hint" aria-live="polite">
              Translates as you type.
            </p>
          </div>

          <button
            class="swap"
            id="swapButton"
            type="button"
            aria-label="Swap direction"
            title="Swap direction"
          >
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path
                d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>

          <div class="pane">
            <div class="pane-head">
              <span id="outputLabel">Binary</span>
              <button class="primary" id="copyButton" type="button" disabled>
                Copy
              </button>
            </div>
            <div
              id="trans"
              class="output"
              role="region"
              aria-labelledby="outputLabel"
              tabindex="0"
            ></div>
            <p class="hint" id="stats">&nbsp;</p>
          </div>
        </div>

        <details class="breakdown" id="breakdown" hidden>
          <summary>Character breakdown</summary>
          <ul class="chips" id="chips"></ul>
        </details>
      </section>

      <p class="visually-hidden" id="announcer" aria-live="polite"></p>

      <footer class="footer">
        Made by Chris Welter ·
        <a href="https://github.com/xryswelter/Binary-Translator"
          >Source on GitHub</a
        >
      </footer>
    </main>
    <script src="./main.js"></script>
  </body>
</html>
